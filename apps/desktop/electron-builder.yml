appId: app.zexa.dbdesk
productName: DBDesk
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.spec.ts'
  - '!**/*.test.ts'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
compression: maximum
# Optimize ASAR packaging
asar: true
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/node_modules/better-sqlite3/**/*'
  - '**/node_modules/bindings/**/*'
  - '**/node_modules/file-uri-to-path/**/*'
extraResources:
  # Self-contained CLI package staged by `pnpm --dir packages/cli run build`
  # (dist + migrations + skill + package.json + prod node_modules).
  # The desktop build scripts always build the CLI first.
  - from: ../../packages/cli/bundled
    to: cli
    filter:
      - '**/*'
      - '!node_modules{,/**/*}'
  # Keep node_modules as its own file set: nested dependency trees can be
  # filtered while walking a broader extraResources source.
  - from: ../../packages/cli/bundled/node_modules
    to: cli/node_modules
    filter:
      - '**/*'
  - from: build/mac/dbdesk.sh
    to: cli/dbdesk.sh
# Remove unnecessary Electron files
removePackageKeywords: true
publish:
  provider: github
  owner: zexahq
  repo: dbdesk
  releaseType: release
protocols:
  - name: DBDesk
    schemes:
      - dbdesk
win:
  executableName: dbdesk
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Zexa Technologies <contact@zexa.app>
  category: Utility
  executableName: dbdesk
deb:
  afterInstall: build/linux/after-install.sh
  artifactName: ${productName}_${version}_${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}.${ext}
