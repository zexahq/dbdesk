name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Match tag to desktop version
        shell: bash
        run: |
          expected="v$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match desktop version $expected" >&2
            exit 1
          fi

  build-linux:
    name: Build Linux
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        working-directory: apps/desktop
        run: |
          pnpm --dir ../../packages/cli run build
          pnpm exec electron-vite build
          pnpm exec electron-builder --linux --publish never

      - name: Upload Linux release files
        uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows package
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          NODE_OPTIONS: '--max-old-space-size=6144'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        working-directory: apps/desktop
        run: |
          pnpm --dir ../../packages/cli run build
          pnpm exec electron-vite build
          pnpm exec electron-builder --win --publish never

      - name: Upload Windows release files
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            apps/desktop/dist/*-setup.exe
            apps/desktop/dist/*-setup.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error

  build-mac:
    name: Build macOS
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify signing secrets
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign, and notarize macOS package
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}
          NODE_OPTIONS: '--max-old-space-size=6144'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: apps/desktop
        run: |
          pnpm --dir ../../packages/cli run build
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac --arm64 --publish never -c.mac.forceCodeSigning=true

      - name: Verify macOS signature and notarization
        working-directory: apps/desktop
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-*/DBDesk.app
          spctl --assess --type execute --verbose=2 dist/mac-*/DBDesk.app
          xcrun stapler validate dist/*.dmg

      - name: Upload macOS release files
        uses: actions/upload-artifact@v6
        with:
          name: macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.dmg.blockmap
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          path: release-files

      - name: Verify update metadata
        shell: bash
        run: |
          test -f release-files/linux/latest-linux.yml
          test -f release-files/windows/latest.yml
          test -f release-files/macos/latest-mac.yml

      - name: Create or resume draft release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != 'true' ]]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to replace its assets" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          fi

      - name: Upload release files
        run: gh release upload "$GITHUB_REF_NAME" release-files/*/* --clobber

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
