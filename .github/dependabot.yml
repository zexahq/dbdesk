version: 2

# Single bot for dbdesk: Dependabot handles BOTH routine version updates and
# security patches across npm and GitHub Actions.
#
# "dbdesk-bot" branding: the PR author account is always `dependabot[bot]`
# (managed by GitHub, not renameable). The name is surfaced through the commit
# prefix and PR labels below, which is as far as Dependabot customization goes.
updates:
  # ---- JS/TS dependencies (pnpm workspace) ----------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "dbdesk-bot"
      include: "scope"
    labels:
      - "dependencies"
      - "dbdesk-bot"
    rebase-strategy: "auto"
    groups:
      electron:
        patterns:
          - "electron"
          - "electron-*"
          - "@electron-toolkit/*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      monaco:
        patterns:
          - "monaco-*"
          - "@monaco-editor/*"
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "electron-vite"
          - "electron-builder"
          - "typescript"
          - "eslint*"
          - "prettier*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "turbo"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      # Bundle all security patches into a single PR.
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Disruptive tooling majors — bump manually when ready.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions used in workflows -------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "dbdesk-bot"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "dbdesk-bot"
    groups:
      github-actions:
        patterns:
          - "*"
